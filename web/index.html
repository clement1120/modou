<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>墨读 · 书源引擎 M5</title>
<!-- 开场防闪：主题必须在首帧前同步落定。
     主题存在 IndexedDB 里（异步），等它读完首帧已经按 light 画完 → 夜间模式开屏会闪一下亮色。
     所以把选择镜像到 localStorage（同步读），这里在解析阶段就写好 data-theme。 -->
<script>
  (function () {
    try {
      var m = localStorage.getItem('modou.theme') || 'light';
      var dark = m === 'dark';
      if (m === 'auto') {
        // 优先问原生壳（Configuration.uiMode 才是准的）；WebView 的 prefers-color-scheme 不可靠
        var sys = null;
        try {
          if (window.ModouBridge && typeof window.ModouBridge.isSystemDark === 'function') {
            sys = !!window.ModouBridge.isSystemDark();
          }
        } catch (e) {}
        dark = sys === null
          ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          : sys;
      }
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {
      /* 隐私模式下 localStorage 可能不可用，保持 HTML 上的默认 light */
    }
  })();
</script>
