<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>轻阅 · 引擎宿主</title>
<!-- 开场防闪：主题镜像到 localStorage（同步读），首帧前写好 data-theme。
     原生壳冷启动底色按 SharedPreferences 走，这里只兜网页调试场景。 -->
<script>
  (function () {
    try {
      var m = localStorage.getItem('modou.theme') || 'light';
      document.documentElement.dataset.theme = (m === 'dark' || m === 'auto') ? 'light' : 'light';
      if (m === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  })();
</script>
</head>
<body>
<!-- 无 UI：本页只作为引擎 / 一次性数据迁移（IndexedDB→SQLite）的宿主，由 MainActivity 的隐藏 WebView 加载。
     书源引擎由常驻的 SourceService（source-service.html）承载；本页仅保留 window.__modouMigrateNow。 -->
<script type="module">
  import './js/db.js';
</script>
</body>
</html>
