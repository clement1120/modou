name: CI

on:
  push:
    branches: [main, fix/storage-source-check-memory, feature/md3-panel-web-render, feat/ci-cover-perf]
  pull_request:

jobs:
  test:
    name: JS 引擎 + UI 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 启动夹具测试服务（8090，8080 常被占用）
        run: |
          MODOU_FIXTURES=1 PORT=8090 node server/proxy-server.js &
          sleep 3

      - name: 存储层单测
        run: node test/store-layer.mjs

      - name: 引擎 + 本地导入测试
        run: npm test

      - name: UI 冒烟（187 基线）
        env:
          MODOU_BASE: http://127.0.0.1:8090
        run: npm run test:ui

  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 构建
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          bash gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: modou-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
